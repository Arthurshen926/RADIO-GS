version: 1
created: '2026-05-17'
purpose: Public, paper-facing canonical registry for the current three-track RADIO-GS/CTF-GS
  evidence package.
method_name: CTF-GS
repository_name: RADIO-GS
tracks:
  t1_lerf_rendered_view_ovs:
    task_name: LERF-OVS rendered-view open-vocabulary segmentation/localization
    source_json: paper/artifacts/lerf_rendered_grounding_feature_sam3_boundary_20260525.json
    protocol:
      scenes:
      - figurines
      - ramen
      - teatime
      - waldo_kitchen
      evaluator: frozen SigLIP2 text scorer over rendered RADIO-compatible feature
        maps
      threshold_policy: fixed_global_mask_threshold:0.60 + peak_connected_component
        coarse prompt + feature-only SAM3 boundary readout with GT-free heatmap-support
        acceptance
      metrics:
      - LocAcc
      - mIoU
      caveat: This is a rendered-view feature-map protocol, not direct primitive selection.
    rows:
      framewise_radio_teacher:
        source: same evaluator controlled baseline
        locacc: 0.7985
        miou: 0.4634
      nearest_view_radio_cache:
        source: same evaluator controlled baseline
        locacc: 0.2722
        miou: 0.1545
      per_gaussian_1280d_radio_memory:
        source: same evaluator controlled baseline
        locacc: 0.5642
        miou: 0.3182
        registered_gaussian_fraction: 0.202
      ctfgs_rendered:
        source: paper-facing feature-only SAM3 boundary readout
        locacc: 0.8598
        miou: 0.5889
      ctfgs_rendered_peak_component_core:
        source: peak-component core readout before feature-only SAM3 boundary refinement
        locacc: 0.8598
        miou: 0.5707
        promoted: false
      ctfgs_rendered_heatmap_threshold_0p60:
        source: historical heatmap-threshold readout retained for localization audit
        locacc: 0.8712
        miou: 0.5243
        promoted: false
  t2_lerf_direct_3d_selection:
    task_name: LERF-OVS text-to-Gaussian direct 3D object selection
    source_report: output/radio_gs/reports/lerf_direct_3d_selection.md
    protocol:
      scenes:
      - figurines
      - ramen
      - teatime
      - waldo_kitchen
      evaluator: OpenGaussian-style query-select-render mask evaluation
      metrics:
      - mIoU
      - Acc@0.25
      main_selector_policy: fixed_global_softmax_threshold:thr0p25
      vpr_registration_views: 128
      selection_floor: 0.005
      selection_cap: 0.018
      caveat: OpenGaussian is still an official-source context row for LERF; four-scene
        compatibility language_features assets are now available, but a strict official-policy
        rerun is still pending.
    rows:
      opengaussian_official_context:
        source: OpenGaussian paper Table/official source
        miou: 0.3836
        acc025: 0.5143
        reproduced_local: false
      ctfgs_vpr_fixed_thr0p25_rgb_snap:
        source: local CTF-GS run
        miou: 0.4801
        acc025: 0.676
        reproduced_local: true
      ctfgs_sam3_box_fixed_pad16_thr0p25:
        source: local frozen official SAM3 box readout
        miou: 0.5705
        acc025: 0.6835
        reproduced_local: true
        caveat: 3D selection plus frozen 2D boundary readout; not pure Gaussian-level
          segmentation.
      ctfgs_sam3_box_scene_locked_diagnostic:
        source: diagnostic only
        miou: 0.5972
        acc025: 0.7009
        reproduced_local: true
        promoted: false
