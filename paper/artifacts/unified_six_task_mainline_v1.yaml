schema_version: 1
name: unified-six-task-mainline-v1
status: development_candidate
declared_at: 2026-08-10

claim_boundary:
  unified_paper_claim_eligible: false
  reason: >-
    The current best rows have mixed field and query-interface lineage.  This
    registry separates strict reusable-field evidence, target-RGB-assisted
    evidence, legacy/task-specific bypasses, and external reproductions until
    one factorized compact field passes all six promotion gates.

capability_tracks:
  strict_reusable_field:
    target_rgb_at_query_time: false
    target_gt_visible_to_method: false
  target_rgb_assisted:
    target_rgb_at_query_time: true
    target_gt_visible_to_method: false
  oracle_diagnostic:
    target_gt_visible_to_method: true
    paper_primary_eligible: false
  external_reproduction:
    ours_method_claim: false

shared_architecture_target:
  scene_memory: factorized_compact_canonical_gaussian_field
  primitive_state:
    - semantic_direction
    - log_amplitude
    - directional_dispersion
    - amplitude_uncertainty
    - observation_evidence
    - visibility_purity
    - multiscale_region_tokens
  evidence_adapters:
    text: [lerf2d, lerf3d, scannet_ovs]
    registered_2d: [nvos, spin9]
    world_3d_click: [agile3d]
    optional_target_rgb_proposal: [lerf2d, lerf3d, nvos, spin9]
  query_likelihood:
    schema: monotone-query-likelihood-v1
    implementation: radio_gs/querying/query_likelihood_head.py
    output_contract: primitive_foreground_probability_q_plus_observation_confidence_c
    invariants:
      - permutation_invariant_observation_sets
      - monotone_positive_and_negative_evidence
      - exact_zero_confidence_abstention
    status: interface_implemented_training_pending
  inference: authority_preserving_reliability_calibrated_primitive_posterior
  output_operators:
    native_2d_raster: [lerf2d, nvos, spin9]
    gaussian_selection_render: [lerf3d]
    point_or_gaussian_readout: [scannet_ovs, agile3d]

