  lerf_figurines_capability_relative_v3_source_gate_authority: paper/artifacts/source_sam_single_radio_lerf_figurines_capability_relative_v3_source_gate_result_20260811.json
  lerf_figurines_capability_relative_v3_rgb_free_authority: paper/artifacts/source_sam_single_radio_lerf_figurines_capability_relative_v3_rgb_free_benchmark_result_20260811.json
  result_summary:
    global_same_cosine_delta: 0.00022041797637939453
    global_separate_cosine_delta: -0.0010018348693847656
    scale_triplet_violation_rate_delta: -0.003884047269821167
    scannet_scene0000_mean_three_split_miou_delta: 0.005162083290670212
    lerf3d_figurines_miou_delta: -0.00052505731582644
