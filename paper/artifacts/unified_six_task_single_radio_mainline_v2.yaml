    lerf2d_capability_relative_v3_minus_v2_miou: 0.0002977840735444166
  promotion_scope: >-
    Full frozen ScanNet paper8 exact evaluation passed all no-regression gates,
    but both separately trained figurines sentinels were near-neutral and
    failed the LERF promotion gates.  Moving the v3 relation loss into frozen
    official DINO+SAM capability space improves every source gate and is
    slightly better than v2 on both LERF mIoU readouts, but the effect is only
    0.0125--0.0298 percentage points.  V2 and v3 therefore remain
    source-positive diagnostics rather than the global six-task primary field.

