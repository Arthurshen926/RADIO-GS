schema_version: 2
name: unified-six-task-single-radio-mainline-v2
status: source_sam_capability_relative_v3_source_passed_lerf_joint_failed
declared_at: 2026-08-10

claim_boundary:
  unified_paper_claim_eligible: false
  reason: >-
    The primary track is now restricted to one persistent canonical RADIO
    feature field and RGB-free query-time inference.  Existing RGB-assisted
    results remain diagnostic upper bounds while the source-only official-SAM
    structural teacher is distilled into that one field and all six frozen
    task gates are rerun.

mainline_contract:
  persistent_scene_representation:
    semantic_feature_family: radio
    stored_semantic_feature_tensors: [canonical_radio]
    allowed_nonsemantic_state:
      - geometry
      - log_amplitude
      - directional_dispersion
      - observation_evidence
      - visibility_purity
      - reliability
      - mpr_support
    forbidden_persistent_feature_branches:
      - sam
      - clip
      - siglip
      - dino
      - task_specific_object_memory
  mapping_time:
    source_rgb_allowed: true
    official_sam_allowed: true
    teacher_role: training_only_relational_supervision
    teacher_payload_in_field_checkpoint: false
    target_or_evaluation_rgb_allowed: false
    benchmark_query_or_metric_allowed: false
  query_time:
    source_rgb_allowed: false
    target_rgb_allowed: false
    source_rgb_proposal_sidecar_allowed: false
    target_rgb_proposal_sidecar_allowed: false
    target_gt_visible_to_method: false
    field_input: canonical_radio_plus_allowed_nonsemantic_state
    legal_query_inputs:
      text: [lerf2d, lerf3d, scannet_ovs]
      reference_scribble_or_mask_without_rgb: [nvos, spin9]
      world_3d_clicks: [agile3d]
  multiscale:
    stored_feature_count_per_primitive: 1
    mechanism: pool_the_same_radio_field_over_mpr_supports
    repeated_teacher_descriptor_is_not_a_distinct_scale: true

capability_tracks:
  single_radio_field:
    paper_primary_eligible: true
    query_time_source_rgb: false
    query_time_target_rgb: false
    target_gt_visible_to_method: false
  query_rgb_assisted_diagnostic:
    paper_primary_eligible: false
    target_gt_visible_to_method: false
  teacher_bypass_diagnostic:
    paper_primary_eligible: false
  external_reproduction:
    paper_primary_eligible: false
    ours_method_claim: false

shared_architecture_target:
  scene_memory: canonical_compact_single_radio_gaussian_field
  persistent_semantic_feature: radio
  build_time_teachers:
    official_sam:
      purpose: instance_boundary_and_multiview_region_relation
      objective: scale_matched_relative_order_plus_control_relative_no_harm
      persistence: absent_after_training
    frozen_radio_adaptors:
      purpose: source_only_response_alignment
      persistence: absent_after_training
  query_likelihood:
    implementation: radio_gs/querying/query_likelihood_head.py
    input_source: canonical_radio_only
    output_contract: primitive_foreground_probability_q_plus_observation_confidence_c
  output_operators:
    native_2d_raster: [lerf2d, nvos, spin9]
    gaussian_selection_render: [lerf3d]
    point_or_gaussian_readout: [scannet_ovs, agile3d]

source_sam_field_upgrade:
  stage: scannet_paper8_exact_passed_lerf_v2_and_v3_joint_sentinels_not_promoted
  training_scene: scannet_paper8_eight_source_scenes
  persistent_semantic_feature: radio
  field_architecture_changed: false
  source_rgb_or_official_sam_at_evaluation: false
  source_gate_authority: paper/artifacts/source_sam_single_radio_scene0000_relative_v2_source_gate_result_20260810.json
  scannet_sentinel_authority: paper/artifacts/source_sam_single_radio_scene0000_scannet_ovs_sentinel_result_20260810.json
