schema_version: 1
freeze_id: evaluation_protocols_20260801_v1
created: 2026-08-01
purpose: >-
  Single canonical selector for external-method evaluation protocols. Detailed
  provenance remains in the two registries and benchmark reports; this file
  prevents a historical diagnostic from silently replacing a frozen row.

governance:
  primary_registry: paper/artifacts/evaluation_protocol_registry_20260731.yaml
  promptable_registry: paper/artifacts/promptable_nvs_protocol_registry.yaml
  consolidated_report: paper/artifacts/evaluation_protocol_audit_summary_20260731.md
  protocol_change_requires:
    - a new protocol id rather than mutating the meaning of a frozen id
    - a written reason and before/after sensitivity result
    - a complete cohort or an explicit incomplete-cohort label
    - immutable result hashes and passing freeze validation
  historical_results_may_replace_canonical_rows: false
  oracle_may_select_reported_configuration_or_metric: false
  cleanup_requires_user_approval: true
  cleanup_may_remove_must_keep_artifacts: false
  execution_safety_is_evaluation_semantics: false
  gpu0_execution_safety:
    power_limit_w: 300
    warning_temperature_c: 78
    pause_temperature_c: 81
    resume_temperature_c: 70
    hard_stop_temperature_c: 84
    note: execution-only; must not alter cohorts, prompts, calibration, metrics, or aggregation

