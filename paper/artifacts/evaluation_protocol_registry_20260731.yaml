schema_version: 1
created: 2026-07-31
purpose: >-
  Cross-benchmark, fail-closed registry for the external-method evaluation
  audit. A numerical paper delta is not a same-protocol claim unless every
  protocol-match dimension is true and strict_table_eligible is true.

reporting_policy:
  oracle_metrics_are_diagnostic_only: true
  incomplete_cohorts_are_strictly_comparable: false
  preserve_historical_rows: true
  historical_rows_policy: >-
    Existing paper tables and final_rows.yaml are provenance records. This
    registry governs whether a row may be described as a strict reproduction;
    it does not silently overwrite historical post-hoc values.
  aggregation_policy: >-
    Store scene-equal macro and query-weighted micro separately. Use only the
    aggregation that reproduces the published metric when computing a paper
    delta, and disclose mixed aggregation across metrics.
  target_visibility_policy: >-
    Methods that consume target RGB at training or query time cannot be placed
    in a strict-unseen reusable-field row.

evaluations:
  lerf2d_langsplatv2_exact_camera_20260731:
    benchmark_family: concept_query
    task: LERF-OVS rendered-view 2D open-vocabulary segmentation/localization
    method: LangSplatV2
    completion: complete
    evidence_class: released_code_reproduction
    cohort:
      complete: true
      scenes: [figurines, teatime, ramen, waldo_kitchen]
      annotated_frames: 22
      queries: 208
      labelled_camera_roles: {train: 15, test: 7}
    protocol:
      query: official annotation strings
      camera_mapping: exact annotation stem over train-camera plus test-camera union
      mask_threshold: 0.4
      semantic_levels: 3
      metric_domain: labelled image pixels and localization bboxes
      aggregation: >-
        mIoU paper delta uses four-scene equal macro; LocAcc paper delta uses
        208-query micro, matching the published mixed overall convention
      calibration: released fixed threshold; no target-mask threshold selection
      target_visibility: mixed labelled train/test roles from eval=True checkpoints
    comparability:
      paper_comparison: diagnostic_only
      strict_table_eligible: false
      reasons:
        - The released evaluator indexed the train-camera list by original frame index; the audit applies a minimal exact-name camera correction.
        - Fifteen of 22 annotated views have train role, conflicting with held-out-test-view prose.
        - The checkpoints are local compatibility checkpoints rather than a released paper checkpoint bundle.
      protocol_match_to_paper:
        cohort: true
        prompt_or_query: true
        target_visibility: false
        metric_domain: true
        aggregation: true
        calibration: true
        implementation: false
    reported_metrics:
      - name: miou_scene_macro_percent
        role: primary
        local: 61.51
        paper: 59.9
        delta_points: 1.61
      - name: localization_accuracy_query_micro_percent
        role: primary
        local: 79.8076923076923
        paper: 84.1
        delta_points: -4.2923076923077
      - name: miou_query_micro_percent
        role: secondary
        value: 62.45120192307693
      - name: localization_accuracy_scene_macro_percent
        role: secondary
        value: 79.84554088785409
      - name: prior_buggy_miou_scene_macro_percent
        role: diagnostic
        value: 46.010000000000005
      - name: prior_buggy_localization_scene_macro_percent
        role: diagnostic
        value: 61.76
    artifacts:
      cohort_summary: output/protocol_audit_20260731/langsplatv2_lerf2d_view_fix/cohort_summary.json
      reproduction_package: reproductions/langsplatv2
      minimal_patch_sha256: a0ba52f843fdc21a0135f71b2ebe2edb5112c4ef48235a080c3c8828a5b285f3

