  scannet_ovs_vala_gaussian_vs_mesh_p0_2scene_20260801:
    benchmark_family: concept_query
    task: ScanNet-v2 VALA-domain isolation on a prespecified two-scene P0 subset
    method: VALA compatibility assets
    completion: complete
    evidence_class: compatibility_reproduction
    cohort:
      complete: true
      scope: two_scene_cpu_only_metric_domain_sensitivity
      scenes: [scene0000_00, scene0400_00]
      benchmark_scenes: 8
      full_vala8_complete: false
      splits: [19, 15, 10]
    protocol:
      query: exact upstream ScanNet class-name text cache for the 19/15/10 splits
      target_visibility: all ScanNet training views are available
      metric_domain: >-
        paired local readouts on cached VALA-pruned Gaussian centers: direct
        normalized 512-D cosine predictions with anisotropic pseudo-GT and
        volume weighting, versus the archived inverse-distance mesh-kNN4
        unweighted result
      aggregation: unweighted macro over the same two prespecified scenes
      calibration: no target-scene threshold or prompt selection in this CPU-only replay
    comparability:
      paper_comparison: forbidden
      strict_table_eligible: false
      reasons:
        - This is a two-scene P0 sensitivity experiment, not the complete eight-scene VALA benchmark.
        - Both branches reuse local compatibility checkpoints and cached 2D/Gaussian features rather than an official paper checkpoint bundle.
        - The Gaussian branch approximates the evaluation domain, but it cannot recover the paper's render-significance aggregation, gating, pruning, or checkpoint provenance.
        - The paired domain delta is diagnostic only and must not be presented as a VALA paper reproduction or paper gap.
      protocol_match_to_paper:
        cohort: false
        prompt_or_query: true
        target_visibility: true
        metric_domain: false
        aggregation: false
        calibration: false
        implementation: false
    reported_metrics:
