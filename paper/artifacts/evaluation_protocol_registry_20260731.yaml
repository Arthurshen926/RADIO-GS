schema_version: 1
created: 2026-07-31
updated: 2026-08-01
purpose: >-
  Cross-benchmark, fail-closed registry for the external-method evaluation
  audit. A numerical paper delta is not a same-protocol claim unless every
  protocol-match dimension is true and strict_table_eligible is true.

reporting_policy:
  oracle_metrics_are_diagnostic_only: true
  incomplete_cohorts_are_strictly_comparable: false
  preserve_historical_rows: true
  historical_rows_policy: >-
    Existing paper tables and final_rows.yaml are provenance records. This
    registry governs whether a row may be described as a strict reproduction;
    it does not silently overwrite historical post-hoc values.
  aggregation_policy: >-
    Store scene-equal macro and query-weighted micro separately. Use only the
    row-specific aggregation that numerically reproduces a published metric
    when computing a paper delta. Disclose mixed aggregation and source-table
    heterogeneity; a numerical row match never establishes a benchmark-wide
    formal aggregation rule.
  target_visibility_policy: >-
    Methods that consume target RGB at training or query time cannot be placed
    in a strict-unseen reusable-field row.

evaluations:
  lerf2d_langsplatv2_exact_camera_20260731:
    benchmark_family: concept_query
    task: LERF-OVS rendered-view 2D open-vocabulary segmentation/localization
    method: LangSplatV2
    completion: complete
    evidence_class: compatibility_reproduction
    cohort:
      complete: true
      scenes: [figurines, teatime, ramen, waldo_kitchen]
      annotated_frames: 22
      queries: 208
      labelled_camera_roles: {train: 15, test: 7}
      labelled_query_roles: {train: 134, test: 74}
      local_checkpoint_levels: 12
      local_checkpoint_eval_true: 12
    protocol:
      query: official annotation strings
      camera_mapping: exact annotation stem over train-camera plus test-camera union
      mask_threshold: 0.4
      semantic_levels: 3
      metric_domain: labelled image pixels and localization bboxes
      aggregation: >-
        LangSplatV2-row-specific numerical match only: mIoU paper delta uses
        four-scene equal macro and LocAcc uses 208-query micro. The surrounding
        source-context table is aggregation-heterogeneous, so this is not a
        benchmark-wide formal mixed-aggregation rule.
      calibration: >-
        released fixed segmentation threshold 0.4 with no target-mask
        selection; localization is independent of the mask threshold
      target_visibility: >-
        local eval=True checkpoints create mixed labelled train/test roles,
        whereas released LangSplatV2 train.sh omits --eval and defaults to
        all-view eval=False training
      effective_quick_render_topk: 4
      localization_level_selection: argmax over each level's 29x29-average-pooled peak
      localization_bbox_rule: any tied maximum inside any merged bbox, inclusive boundary
    comparability:
      paper_comparison: diagnostic_only
      strict_table_eligible: false
      reasons:
        - The released evaluator indexed the train-camera list by original frame index; the audit applies a minimal exact-name camera correction.
        - Released LangSplatV2 train.sh defaults to eval=False/all-view training, while all twelve local level checkpoints record eval=True and withhold every eighth camera from language-field training.
        - Seventy-four of 208 evaluated query units lie on labelled views withheld by the local eval=True split, while 134 lie on local train-role views.
        - The checkpoints use local Occam-compatible RGB starts and compatibility language features rather than an identity-verified official LangSplatV2 checkpoint bundle.
        - The audit checkout contains training-side loss/VQ compatibility edits, so clean paper-training implementation identity is not established.
        - Mixed aggregation is only a numerical match for the LangSplatV2 printed row; every other listed 2D baseline Acc mean matches scene macro, making the source-context table aggregation-heterogeneous.
      protocol_match_to_paper:
        cohort: false
        prompt_or_query: true
        target_visibility: false
        metric_domain: true
        aggregation: false
        calibration: true
        implementation: false
    reported_metrics:
      - name: miou_scene_macro_percent
        role: primary
        local: 61.51
        paper: 59.9
        delta_points: 1.61
      - name: localization_accuracy_query_micro_percent
