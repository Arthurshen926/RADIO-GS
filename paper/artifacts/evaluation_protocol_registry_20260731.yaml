        local: 79.8076923076923
        paper: 84.1
        delta_points: -4.2923076923077
      - name: miou_query_micro_percent
        role: secondary
        value: 62.45120192307693
      - name: localization_accuracy_scene_macro_percent
        role: secondary
        value: 79.84554088785409
      - name: prior_buggy_miou_scene_macro_percent
        role: diagnostic
        value: 46.010000000000005
      - name: prior_buggy_localization_scene_macro_percent
        role: diagnostic
        value: 61.76
      - name: localization_hits
        role: diagnostic
        value: 166
      - name: nearest_paper_scene_row_integer_hit_reconstruction
        role: diagnostic
        value: 175
      - name: nearest_paper_hit_deficit
        role: diagnostic
        value: 9
      - name: labelled_queries_locally_withheld_by_eval_true
        role: diagnostic
        value: 74
    diagnosis:
      known_remaining_evaluator_protocol_error_explains_locacc_gap: false
      dominant_remaining_gap_class: checkpoint_training_and_feature_provenance
      locacc_gap_receipt: >-
        local 166/208; nearest reconstruction from printed scene rows 175/208,
        approximately nine hits. Ramen 74.7 percent is not exactly realizable
        by an integer numerator over 71 at its printed precision.
      cpu_counterfactual_boundary: >-
        exact-camera outputs contain no rendered feature/relevance cache,
        localization levels, peak coordinates, or per-query hit bits; top-k,
        level, tie, bbox, and camera-role counterfactuals require a new render
      reporting_label: >-
        LangSplatV2 released-code-intent / local-checkpoint exact-camera diagnostic
    artifacts:
