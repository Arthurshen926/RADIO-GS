  spin_nerf_ludvig_9scene_missing_fork_20260731:
    benchmark_family: spatial_prompt
    task: SPIn-NeRF multiview foreground segmentation
    method: LUDVIG-SAM
    completion: blocked
    evidence_class: diagnostic
    cohort:
      complete: false
      available_scenes: [orchids, leaves, fern, room, horns, fortress, pinecone, truck, lego]
      missing_scenes: [fork]
      annotated_frames: 423
      reason: >-
        Fork data is absent. Exact fern checkpoint reuse is CPU-preflighted,
        but the 30k checkpoint and all GPU evaluation are pending recovery
        from GPU0 lost; the other eight available scenes have no compatible
        local all-view 30k checkpoints.
    protocol:
      prompt: complete first-frame reference mask
      target_visibility: released LUDVIG sees all RGBs and calls SAM on target views
      metric_domain: foreground image IoU on non-reference annotated frames
      aggregation: frame mean then equal-weight macro over scenes
      calibration: per-scene SAM candidate and threshold selected on the reference GT mask
    comparability:
      paper_comparison: forbidden
      strict_table_eligible: false
      reasons:
        - The local cohort is nine scenes rather than the paper's ten.
        - No completed compatible all-view 30k checkpoint or local SPIn metric is available while GPU0 is lost.
        - Only fern checkpoint reuse is preflighted; the other eight available scenes remain without compatible all-view geometry.
        - The nine-scene paper context 94.5778 must not be substituted for the full-ten-scene 93.8 row.
      protocol_match_to_paper:
        cohort: false
        prompt_or_query: true
        target_visibility: true
        metric_domain: true
        aggregation: false
        calibration: true
        implementation: true
    paper_context:
      full_10scene_miou_percent: 93.8
      same_available_9scene_macro_percent: 94.5777777778
    artifacts:
      manifest: output/protocol_audit_20260731/manifests/spin_nerf_full_reference_mask_9scene_diagnostic_v1.json
      fern_checkpoint_reuse_preflight: output/protocol_audit_20260731/ludvig/spin/preflight/fern_checkpoint_reuse_v1/preflight_manifest.json
