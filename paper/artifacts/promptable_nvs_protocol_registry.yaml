      spin_nerf: {miou: 93.2, macc: 99.1}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    cautions:
      - Prompt-specific propagation repeatedly invokes SAM on multiple views.
      - Keep as paper-reported context until the prompt points and interaction budget are reproduced locally.

  - method: OmniSeg3D
    method_id: ying_et_al_cvpr_2024_omniseg3d
    track: reusable_feature_field
    source: >-
      https://openaccess.thecvf.com/content/CVPR2024/papers/Ying_OmniSeg3D_Omniversal_3D_Segmentation_via_Hierarchical_Contrastive_Learning_CVPR_2024_paper.pdf
    values:
      nvos: {miou: 91.7, macc: 98.4}
      spin_nerf: {miou: 94.3, macc: 99.3}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    cautions:
      - Do not use the older arXiv-v1 SPIn-NeRF value 95.2.
      - Keep as paper-reported context; the local full-reference-mask prototype readout is a different query interface.

