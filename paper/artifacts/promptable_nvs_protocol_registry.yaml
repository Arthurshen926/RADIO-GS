schema_version: 1
created: 2026-07-12
purpose: >-
  Fail-closed registry for NVOS and SPIn-NeRF promptable novel-view
  segmentation. Published values are context only until a row has the same
  protocol fingerprint and, for reproduced rows, has been scored by the local
  evaluator.

protocols:
  nvos_strict_unseen_v1:
    dataset: NVOS
    tasks:
      - fern
      - flower
      - fortress
      - horns_center
      - horns_left
      - leaves
      - orchids
      - trex
    prompt:
      frame_role: reference
      type: fixed_positive_and_negative_scribbles
      source: official_nvos_release
    evaluation:
      frames_per_task: 1
      reference_scored: false
      metrics: [foreground_iou, binary_pixel_accuracy]
      aggregation: equal_weight_macro_over_8_tasks
      mask_resize: nearest
      prediction_representation: continuous_cosine_margin
      threshold: {comparison: greater_or_equal, value: 0.0}
    visibility:
      target_rgb_allowed_during_field_training: false
      target_rgb_allowed_at_query: false
      target_mask_use: scoring_only
      sparse_initialization: drop_any_point_observed_by_target_camera
      shared_upstream_camera_calibration_exception: true
    calibration:
      target_mask: forbidden
      allowed: fixed_on_external_development_scenes
    combine_with_other_dataset_overall: false

  spin_nerf_full_reference_mask_10scene_v1:
    dataset: SPIn-NeRF multiview segmentation
    scenes:
      - orchids
      - leaves
      - fern
      - room
      - horns
      - fortress
      - fork
      - pinecone
      - truck
      - lego
    prompt:
      frame_role: first_official_annotated_frame_after_canonical_mapping
      type: complete_binary_mask
      source: official_spin_nerf_multiview_segmentation_release
      track_role: full_mask_support_diagnostic
      canonical_paper_task: sparse_positive_and_negative_points_on_one_source_view
      published_saga_protocol: random_subset_of_positive_and_negative_mask_points
      published_saga_point_count_and_seed_disclosed: false
    evaluation:
      reference_scored: false
      metrics: [foreground_iou, binary_pixel_accuracy]
      aggregation: frame_mean_then_equal_weight_macro_over_10_scenes
      mask_resize: nearest
      prediction_representation: continuous_cosine_margin
      threshold: {comparison: greater_or_equal, value: 0.0}
    visibility:
      all_rgb_and_poses_allowed_during_field_training: true
      target_masks_during_training_or_selection: forbidden
      target_mask_use: scoring_only
    calibration:
      reference_mask: allowed_because_it_is_the_task_input
      target_masks: forbidden
    combine_with_other_dataset_overall: false
    published_point_prompt_rows_exactly_comparable: false

  spin_nerf_point_prompt_10scene_v1:
    dataset: SPIn-NeRF multiview segmentation
    status: pending_prompt_sampler_freeze
    reason: >-
      The SAGA supplement says that a random subset of points inside and
      outside the reference mask is used, but does not disclose the subset
      size or random seed. A deterministic point budget/seed must be frozen
      before GaussFM and reproduced baselines can share this row.
    target_masks: scoring_only_except_reference_mask_used_to_generate_prompts
    eligible_published_rows_without_reproduction: false

  ludvig_official_online_multiview_v1:
    dataset: [NVOS, SPIn-NeRF multiview segmentation]
    method_scope: [LUDVIG-SAM, LUDVIG-SAM2, LUDVIG-DINOv2]
    capability_track: online_multiview_propagation
    upstream:
      repository: https://github.com/naver/ludvig
      audited_commit: 4461fc515439bb498a75d71738a1e73cf7a452ed
    common:
      gaussian_splatting:
        implementation: original_3dgs
        iterations: 30000
        training_views: all_registered_scene_views
        source_provenance:
          ludvig_vendored_as_gitlink: false
          reconstruction_lock: reproductions/ludvig/official_3dgs.lock.json
          official_commit: f7a116fb1397d9842239127d39dc212f93171f70
          byte_identical_train_entrypoint: true
          train_entrypoint_sha256: c5a61947e2abcf56bf83451ae9633799d96894910ea2982a01f209c47cec462d
          algorithm_source_patch: null
      target_rgb_visible_during_gaussian_splatting_training: true
      target_rgb_visible_during_uplifting: true
      target_mask_use: scoring_only
      target_view_2d_foundation_model_calls: true
      prediction_resize_before_threshold: bilinear
      metric: foreground_iou
      paper_run_aggregation: mean_over_3_independent_runs
      released_entrypoint_seed: 0
      released_entrypoint_supports_multiple_seeds: false
    nvos:
      tasks: [fern, flower, fortress, horns_center, horns_left, leaves, orchids, trex]
      prompt:
        type: official_positive_scribble
        official_negative_scribble_used_by_released_code: false
        points_per_sam_call: 3
        sam_calls_per_view: 10
      source_mask_calibration:
        sam: false
        sam2: false
        dinov2_graph_diffusion: sam_mask_predicted_on_reference_rgb
      evaluation:
        frames_per_task: 1
        reference_scored: false
        aggregation: equal_weight_macro_over_8_tasks
        sam_threshold_after_per_frame_minmax: {comparison: greater_than, value: 0.25}
        sam2_threshold: li_iterative_minimum_cross_entropy_per_frame
    spin_nerf:
      scenes: [orchids, leaves, fern, room, horns, fortress, fork, pinecone, truck, lego]
      prompt:
        frame_role: first_official_annotated_frame_after_released_code_mapping
        type: complete_binary_mask
        points_per_sam_call: 3
        sam_calls_per_view: 10
      source_mask_calibration:
        reference_ground_truth_mask_used: true
        per_scene_threshold_selected_by_reference_iou: true
        per_scene_sam_candidate_selected_by_reference_iou: true
        non_reference_target_masks_used: false
      evaluation:
        reference_scored: false
        aggregation: frame_mean_then_equal_weight_macro_over_10_scenes
    exact_match:
      nvos_strict_unseen_v1: false
      spin_nerf_full_reference_mask_10scene_v1: false
      reasons:
        - LUDVIG sees target RGB during both 3DGS training and query-specific uplifting.
        - LUDVIG calls a 2D foundation model on target views.
        - SPIn-NeRF LUDVIG selects a threshold and SAM candidate separately for each scene from the reference ground-truth mask.

  ludvig_spin_nerf_9scene_without_fork_diagnostic_v1:
    parent_protocol: ludvig_official_online_multiview_v1
    status: diagnostic_incomplete_cohort
    scenes: [orchids, leaves, fern, room, horns, fortress, pinecone, truck, lego]
    missing_scenes: [fork]
    evaluation:
      reference_scored: false
