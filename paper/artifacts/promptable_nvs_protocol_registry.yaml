tracks:
  reusable_feature_field:
    definition: >-
      A scene-level field is trained before the object query. At query time
      only the reference prompt and the frozen field may be used. No 2D model
      is run on target RGB and one fixed 3D selection must be rendered into all
      target views.
    target_view_2d_model_at_query: forbidden
    prompt_specific_scene_optimization: forbidden
    methods: [GaussFM, SAGA, OmniSeg3D]

  online_multiview_propagation:
    definition: >-
      Prompt-specific methods may call a declared 2D foundation model on
      additional RGB views. Their end-to-end masks share the benchmark target,
      but do not demonstrate a reusable feature field.
    report_2d_model_calls_and_query_cost: required_for_reproduced_rows
    methods: [SA3D-GS, SA-GS/SAGD, LUDVIG-SAM, LUDVIG-SAM2]

reported_context:
  - method: SAGA
    method_id: cen_et_al_aaai_2025_segment_any_3d_gaussians
    track: reusable_feature_field
    source: https://ojs.aaai.org/index.php/AAAI/article/view/32193
    values:
      nvos: {miou: 92.6, macc: 98.6}
      spin_nerf: {miou: 93.4, macc: 99.2}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    cautions:
      - NVOS target-RGB exclusion is not verifiable from the released evaluator.
      - The supplement randomly samples positive/negative prompt points but does not disclose their count or seed.
      - SPIn-NeRF SAGA is not exactly comparable to the full-reference-mask GaussFM diagnostic.
      - Do not use the older project-PDF values 90.9/88.0.

  - method: SA3D-GS
    method_id: cen_et_al_ijcv_2024_segment_anything_in_3d
    track: online_multiview_propagation
    source: https://arxiv.org/abs/2304.12308
    values:
      nvos: {miou: 92.2, macc: 98.5}
      spin_nerf: {miou: 93.2, macc: 99.1}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    cautions:
      - Prompt-specific propagation repeatedly invokes SAM on multiple views.
      - Keep as paper-reported context until the prompt points and interaction budget are reproduced locally.

  - method: OmniSeg3D
    method_id: ying_et_al_cvpr_2024_omniseg3d
    track: reusable_feature_field
    source: >-
      https://openaccess.thecvf.com/content/CVPR2024/papers/Ying_OmniSeg3D_Omniversal_3D_Segmentation_via_Hierarchical_Contrastive_Learning_CVPR_2024_paper.pdf
    values:
      nvos: {miou: 91.7, macc: 98.4}
      spin_nerf: {miou: 94.3, macc: 99.3}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    cautions:
      - Do not use the older arXiv-v1 SPIn-NeRF value 95.2.
      - Keep as paper-reported context; the local full-reference-mask prototype readout is a different query interface.

  - method: LUDVIG-SAM
    method_id: marrie_et_al_iccv_2025_ludvig_sam
    track: online_multiview_propagation
    protocol_id: ludvig_official_online_multiview_v1
    source: https://www.openaccess.thecvf.com/content/ICCV2025/papers/Marrie_LUDVIG_Learning-Free_Uplifting_of_2D_Visual_Features_to_Gaussian_Splatting_ICCV_2025_paper.pdf
    values:
      nvos: {miou: 91.3, macc: null}
      spin_nerf: {miou: 93.8, macc: null}
    published_per_scene_iou:
      nvos:
        fern: 85.5
        flower: 97.6
        fortress: 98.1
        horns_center: 97.9
        horns_left: 94.1
        leaves: 96.4
        orchids: 73.1
        trex: 88.0
      spin_nerf:
        orchids: 92.2
        leaves: 96.3
        fern: 97.0
        room: 96.5
        horns: 94.5
        fortress: 98.3
        fork: 86.8
        pinecone: 88.8
        truck: 94.9
        lego: 92.7
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    strict_unseen_exact_match: false
    cautions:
      - NVOS uplifting traverses all COLMAP cameras and therefore sees target RGB.
      - Uses per-view SAM image prediction and is not a reusable SAM feature field.
      - Its source-mask/SAM candidate selection is not the same input as SAGA's undisclosed random point subset.

  - method: LUDVIG-SAM2
    method_id: marrie_et_al_iccv_2025_ludvig_sam2
    track: online_multiview_propagation
    protocol_id: ludvig_official_online_multiview_v1
    source: https://www.openaccess.thecvf.com/content/ICCV2025/papers/Marrie_LUDVIG_Learning-Free_Uplifting_of_2D_Visual_Features_to_Gaussian_Splatting_ICCV_2025_paper.pdf
    values:
      nvos: {miou: 91.3, macc: null}
      spin_nerf: {miou: 93.8, macc: null}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    strict_unseen_exact_match: false
    cautions:
      - SAM2 image predictor, not SAM2-Video.
      - NVOS uplifting traverses all COLMAP cameras and therefore sees target RGB.
      - Its source-mask/SAM candidate selection is not the same input as SAGA's undisclosed random point subset.

  - method: SA-GS/SAGD
    method_id: hu_et_al_2024_sagd
    aliases: [SA-GS, SAGS, SAGD]
    track: online_multiview_propagation
    source: https://arxiv.org/abs/2401.17857
    values:
      nvos: {miou: null, macc: null}
      spin_nerf_9scene_without_leaves: {miou: 90.0, macc: 98.7}
    final_published_version: true
    local_reproduction: false
    exact_local_evaluator: false
    eligible_for_spin_nerf_10scene_table: false
    cautions:
      - Official quantitative table omits Leaves.
      - Click count is not fixed, so the interaction budget is not controlled.
      - This is Hu et al.'s segmentation method, not the unrelated anti-aliasing SA-GS.

