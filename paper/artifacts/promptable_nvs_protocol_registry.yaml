        arbitrary_checkpoint_allowed: false
      gaussian_splatting:
        implementation: original_3dgs
        iterations: 30000
        training_views: all_registered_scene_views
        source_provenance:
          ludvig_vendored_as_gitlink: false
          reconstruction_lock: reproductions/ludvig/official_3dgs.lock.json
          official_commit: f7a116fb1397d9842239127d39dc212f93171f70
