  observation_contract:
    scannet: full_registered_rgbd_query_free_coverage_selection
    lerf_nvos_spin: canonical_mpr_v3
  test_set_calibration: false

text_query:
  readout: SurfaceRegionContractV2
  region_radii_m: [0.25, 0.45, 0.70]
  aggregation: specificity_preserving_after_independent_normalized_cosine
  specificity_margin: 0.02
  specificity_margin_selected_on: controlled_scannet_text_development_scenes
  scene_query_softmax: false
  verified:
    lerf_scene_macro_miou: 0.3196346397323348
    lerf_scene_macro_locacc: 0.5919466141998369
