    scannet_10_scene_macro_miou: 0.5894300527226614

registered_2d_and_world_3d_prompt:
  capabilities: [official_dinov3_adaptor, official_sam3_adaptor]
  query_compiler: typed_canonical_primitive_query
  solver: hard_signed_confidence_random_walker
  threshold: 0.5
  scene_background:
    type: query_free_spherical_modes
    count: 4
    fit_once_per_scene: true
    labels_masks_clicks_metrics_opened: false
  world_3d:
    click_seed: native_gaussian_covariance
    output_readout: continuous_opacity_weighted_gaussian
    evaluator_voxel_size_m: 0.05
    observation_domain_bridge: false

pose_free_patch_retrieval:
  query: official_dinov3_center_3x3
  candidate_domain: public_scannet_5cm_geometry
  instance_labels_used: false
  query_pose_depth_used_by_method: false
  spatial_nms_radius_m: 0.10

