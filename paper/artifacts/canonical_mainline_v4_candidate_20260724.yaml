schema_version: 1
name: canonical-query-field-v4-candidate
status: promotion_candidate
declared_at: 2026-07-24

scene_memory:
  persistent_representation: one_compact_canonical_c_radio_primitive_field
  query_specific_scene_field: false
  capability_banks: derived_disposable_caches

canonical_core:
