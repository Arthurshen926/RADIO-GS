# Shared method-level preset for Unified Multi-Head Feature-Quality Field.
# Merge these keys into LERF or ScanNet scene configs when training the
# submission version with explicit quality and visibility readouts.

hybrid_decoupled_heads: true
hybrid_semantic_adaptor: true
hybrid_semantic_adaptor_mode: "confidence"
hybrid_semantic_adaptor_use_geometry_guidance: true
hybrid_semantic_adaptor_use_depth_guidance: false
hybrid_semantic_adaptor_reg_weight: 0.001

hybrid_quality_head: true
hybrid_visibility_head: true
quality_loss_weight: 0.05
visibility_loss_weight: 0.02
visibility_target_binary: false
visibility_alpha_threshold: 0.02

direct_point_view_count_weighting: "clipped_log"
direct_point_view_count_min_weight: 0.25
direct_point_text_contrast_weight: 0.05
direct_point_text_contrast_pair_weighting: "visibility"
direct_point_render_consistency_weight: 0.05
direct_point_render_consistency_mode: "cosine"
