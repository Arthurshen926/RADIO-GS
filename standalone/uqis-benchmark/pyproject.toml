[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqis-benchmark"
version = "0.2.0.dev0"
description = "Unified text, image, 2-D point and 3-D point query evaluation on ScanNet"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "scipy>=1.10",
  "plyfile>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uqis-audit = "uqis_benchmark.audit_benchmark:main"
uqis-build = "uqis_benchmark.build_benchmark:main"
uqis-evaluate = "uqis_benchmark.evaluate_predictions:main"
uqis-seal-predictions = "uqis_benchmark.seal_predictions:main"
uqis-stage-workspace = "uqis_benchmark.stage_query_workspace:main"
uqis-audit-text = "uqis_benchmark.audit_text_annotations:main"
uqis-construct-scannet = "uqis_benchmark.official_constructor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
